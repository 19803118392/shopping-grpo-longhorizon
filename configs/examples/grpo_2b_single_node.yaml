# Public single-node example. The strict research contract lives under configs/verl.
hydra:
  searchpath:
    - pkg://verl/trainer/config

defaults:
  - ppo_trainer
  - _self_

data:
  train_files: ${oc.env:GRPO_TRAIN_FILE}
  val_files: ${oc.env:GRPO_VAL_FILE}
  train_batch_size: 1
  val_batch_size: 1
  max_prompt_length: 4096
  max_response_length: 4096
  return_raw_chat: true
  filter_overlong_prompts: true
  truncation: error

actor_rollout_ref:
  model:
    path: ${oc.env:GRPO_MODEL_PATH}
    trust_remote_code: true
    enable_gradient_checkpointing: true
    use_remove_padding: false
    lora_rank: 16
    lora_alpha: 32
    target_modules: all-linear
    lora:
      merge: true
    override_config:
      attn_implementation: sdpa
  actor:
    ppo_mini_batch_size: 1
    ppo_micro_batch_size_per_gpu: 1
    ppo_max_token_len_per_gpu: 8192
    use_dynamic_bsz: false
    freeze_vision_tower: true
    use_kl_loss: false
    calculate_entropy: false
    entropy_coeff: 0.0
    optim:
      lr: 1.0e-6
    fsdp_config:
      optimizer_offload: true
      param_offload: true
  rollout:
    name: vllm
    mode: async
    n: 2
    temperature: 0.7
    top_p: 0.9
    tensor_model_parallel_size: 1
    gpu_memory_utilization: 0.45
    max_num_seqs: 2
    max_model_len: 8192
    max_num_batched_tokens: 8192
    calculate_log_probs: true
    log_prob_micro_batch_size_per_gpu: 1
    log_prob_max_token_len_per_gpu: 8192
    log_prob_use_dynamic_bsz: false
    agent:
      num_workers: 2
      default_agent_loop: shopping_tool_agent
      agent_loop_config_path: ${oc.env:SHOPPING_AGENT_LOOP_CONFIG}
    multi_turn:
      enable: true
      format: qwen3_coder
      max_user_turns: 35
      max_assistant_turns: 35
      max_parallel_calls: 1
      max_tool_response_length: 8192
      tool_response_truncate_side: middle
      tool_config_path: ${oc.env:SHOPPING_TOOL_CONFIG}
    val_kwargs:
      n: 1
      temperature: 0.0
      top_p: 1.0
      do_sample: false
  ref:
    log_prob_micro_batch_size_per_gpu: 1
    log_prob_max_token_len_per_gpu: 8192
    log_prob_use_dynamic_bsz: false
    fsdp_config:
      param_offload: true

algorithm:
  adv_estimator: grpo
  use_kl_in_reward: false
  norm_adv_by_std_in_grpo: true

shopping_dynamic_sampling:
  enable: false
  metric: seq_reward
  max_num_gen_batches: 1
  max_consecutive_skipped_updates: 1
  reward_tolerance: 1.0e-8

reward_model:
  enable: false

ray_kwargs:
  ray_init:
    runtime_env:
      worker_process_setup_hook: shopping_grpo.verl_compat.install_torch_padding_fallback

trainer:
  total_epochs: 1
  total_training_steps: 10
  save_freq: -1
  test_freq: -1
  val_before_train: false
  logger: [console]
  project_name: shopping-grpo
  experiment_name: shopping-grpo-example
  default_local_dir: ${oc.env:GRPO_OUTPUT_DIR}
  n_gpus_per_node: 1
  nnodes: 1
