# Minimal environment-reward-only GRPO baseline for Qwen3.5-2B + ShopSimulator.
hydra:
  searchpath:
    - pkg://verl/trainer/config

defaults:
  - ppo_trainer
  - _self_

data:
  train_files: ${oc.env:GRPO_TRAIN_FILE}
  val_files: ${oc.env:GRPO_VAL_FILE}
  train_batch_size: 2
  val_batch_size: 2
  max_prompt_length: 4096
  # 96GB Blackwell 上 24K response 的 actor logits 会把最坏批次推到 OOM。
  # 保留 35 个环境 step，但把可训练的累计 response 限制在 20K。
  max_response_length: 20480
  return_raw_chat: true
  filter_overlong_prompts: true
  truncation: error

actor_rollout_ref:
  model:
    path: ${oc.env:GRPO_MODEL_PATH}
    trust_remote_code: true
    enable_gradient_checkpointing: true
    use_remove_padding: false
    lora_rank: 16
    lora_alpha: 32
    target_modules: all-linear
    # rollout 同步标准权重，避开 Qwen3.5 原生 LoRA 的 base_layer 命名不兼容。
    lora:
      merge: true
    override_config:
      attn_implementation: sdpa
  actor:
    ppo_mini_batch_size: 2
    ppo_micro_batch_size_per_gpu: 1
    ppo_max_token_len_per_gpu: 24576
    # veRL dynamic batch 会忽略上面的固定 micro-batch=1 并重新组合轨迹。
    # 对 248K 词表的 Qwen3.5，最坏长度组合会在 actor log-softmax 处 OOM。
    use_dynamic_bsz: false
    freeze_vision_tower: true
    loss_agg_mode: token-mean
    clip_ratio_low: 0.20
    clip_ratio_high: 0.20
    entropy_coeff: 0.0
    calculate_entropy: false
    use_kl_loss: false
    kl_loss_coef: 0.0
    kl_loss_type: low_var_kl
    optim:
      lr: 1.0e-6
      lr_warmup_steps_ratio: 0.03
    fsdp_config:
      optimizer_offload: true
      param_offload: true
  rollout:
    name: vllm
    mode: async
    n: 4
    temperature: 0.7
    top_p: 0.9
    tensor_model_parallel_size: 1
    gpu_memory_utilization: 0.45
    max_num_seqs: 8
    max_model_len: 24576
    max_num_batched_tokens: 24576
    free_cache_engine: true
    # 直接保留 vLLM rollout policy 的 log-prob，供 PPO bypass mode 使用。
    calculate_log_probs: true
    log_prob_micro_batch_size_per_gpu: 1
    log_prob_max_token_len_per_gpu: 24576
    log_prob_use_dynamic_bsz: false
    agent:
      num_workers: 8
      default_agent_loop: shopping_tool_agent
      agent_loop_config_path: ${oc.env:SHOPPING_GRPO_ROOT}/configs/verl/shop_agent_loops.yaml
    multi_turn:
      enable: true
      format: qwen3_coder
      max_user_turns: 40
      max_assistant_turns: 40
      max_parallel_calls: 1
      # 项目 projector 已按页面类型限制 token；这里仅作不会触发的字符级故障保护。
      max_tool_response_length: 16384
      tool_response_truncate_side: middle
      tool_config_path: ${oc.env:SHOPPING_TOOL_CONFIG,${oc.env:SHOPPING_GRPO_ROOT}/configs/verl/shop_tools.json}
      tokenization_sanity_check_mode: ignore_strippable
    val_kwargs:
      n: 1
      temperature: 0.0
      top_p: 1.0
      do_sample: false
  ref:
    log_prob_micro_batch_size_per_gpu: 1
    log_prob_max_token_len_per_gpu: 24576
    log_prob_use_dynamic_bsz: false
    fsdp_config:
      param_offload: true

algorithm:
  adv_estimator: grpo
  use_kl_in_reward: false
  norm_adv_by_std_in_grpo: true
  rollout_correction:
    # 以实际 rollout policy 作为 PPO old policy，跳过 actor old-log-prob 重算。
    bypass_mode: true
    rollout_is: null
    rollout_rs: null
    loss_type: ppo_clip

# Project-side bounded filtering only; disabled unless explicitly enabled for a run.
shopping_dynamic_sampling:
  enable: false
  metric: seq_reward
  max_num_gen_batches: 3
  max_consecutive_skipped_updates: 10
  reward_tolerance: 1.0e-8

reward_model:
  enable: false

ray_kwargs:
  ray_init:
    runtime_env:
      worker_process_setup_hook: shopping_grpo.verl_compat.install_torch_padding_fallback

trainer:
  total_epochs: 50
  total_training_steps: 500
  save_freq: 50
  test_freq: 50
  val_before_train: true
  # Console keeps a complete local record; W&B mirrors the same per-step
  # metrics dictionary (reward/group/policy/runtime) for online monitoring.
  logger: [console, wandb]
  project_name: shopping-grpo
  experiment_name: vanilla-grpo-v1
  default_local_dir: ${oc.env:GRPO_OUTPUT_DIR}
  n_gpus_per_node: 1
  nnodes: 1
